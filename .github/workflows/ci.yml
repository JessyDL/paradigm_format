name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - release

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt install -y clang-format

      - name: Check Formatting
        run: find . -name '*.cpp' -o -name '*.h' | xargs clang-format -n --Werror
    
  build:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake ninja-build clang-format

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure

      - name: Extract Version
        if: github.ref == 'refs/heads/release'
        run: |
          VERSION_FILE="build/VERSION"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(cut -d'-' -f1 "$VERSION_FILE")  # Extract MAJOR.MINOR.PATCH
            echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "VERSION file not found!"
            exit 1
          fi

      - name: Create Release Tag
        if: github.ref == 'refs/heads/release'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag release/${{ env.PROJECT_VERSION }}
          git push origin release/${{ env.PROJECT_VERSION }}

